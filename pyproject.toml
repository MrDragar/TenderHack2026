[project]
name = "tenderhack2026"
version = "0.1.0"
description = "Автозаполнение характеристик СТЕ по КТРУ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.115.12",
    "openpyxl>=3.1.5",
    "uvicorn[standard]==0.34.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
