[project]
name = "tenderhack2026"
version = "0.1.0"
description = "Автозаполнение характеристик СТЕ по КТРУ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

# Модель проверки на мусор. Без группы пайплайн работает, новое уходит модератору.
nli = [
    "torch>=2.9",
    "transformers>=4.57",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
